name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: database_development
          MYSQL_USER: conduit
          MYSQL_PASSWORD: conduit123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar configuração do backend
        run: |
          cat <<EOF > backend/.env
          PORT=3001
          JWT_KEY=supersecretkey_ci

          DEV_DB_USERNAME=conduit
          DEV_DB_PASSWORD=conduit123
          DEV_DB_NAME=database_development
          DEV_DB_HOSTNAME=127.0.0.1
          DEV_DB_DIALECT=mysql
          DEV_DB_LOGGING=false
          EOF

      - name: Aguardar MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping \
              -h 127.0.0.1 \
              -uconduit \
              -pconduit123 \
              --silent && break
            sleep 2
          done

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium

      - name: Executar migrations
        run: npm run sqlz -w backend db:migrate

      - name: Executar testes
        run: npx playwright test tests/e2e/auth.spec.ts -g "AUTH-001" --project=chromium

      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30